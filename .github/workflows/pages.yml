name: Publikacja GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj wersję publiczną
        run: npm run build:pages

      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Przekaż gotową stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
